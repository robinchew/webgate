<!DOCTYPE html>
<html>
<head>
    <style>
        td {
            text-align: right;
            padding-right: 10px;
        }
    </style>
</head>
<body>
    <div id="connection-header"></div>

    <script>
        function loadScript(src) {
            const scriptAttrs = {
                type: 'text/javascript',
                async: true,
                src,
            };
            return new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = src;
                Object.assign(script, scriptAttrs);
                script.addEventListener('load', () => resolve({ scriptAttrs, loadSuccess: true }));
                script.addEventListener('error', () => resolve({ scriptAttrs, loadSuccess: false }));
                document.head.appendChild(script);
            });
        }
        function logk(k,v) {
            console.log(k,v);
            return v;
        }
        Promise.all(['/van-1.6.1.nomodule.js', '/importEnv.js'].map(loadScript)).then(() => {
            const {a, div, table, tr, td} = van.tags;
            function OldList(list) {
                return div(
                    /*
                    a(
                        {
                            href: '',
                            onclick(e) {
                                e.preventDefault();
                                fetch('/api/last-discharge').then(r => r.json()).then((result) => {
                                    list.val = [result, ...list.val];
                                });
                            },
                        },
                        'Last discharge'),
                    */
                    () => div(
                        list.val.map((subList) =>
                            table(
                                {
                                    style: 'border-bottom: 1px solid black',
                                },
                                subList.map(({datetime, battery_level, household_load}) =>
                                    tr(td(datetime), td(battery_level), td(household_load))))
                        ))
                    );
            }
            function List(list) {
                return div(() => table(
                    list.val.map(({datetime, battery_level, household_load}) =>
                        tr(td(datetime), td(battery_level), td(household_load)))));
            }
            const listState = van.state([]);
            const oldListState = van.state([]);
            document.body.appendChild(OldList(oldListState));
            document.body.appendChild(List(listState));

            const env = importEnv();

            // Connect to the Erlang endpoint
            const eventSource = new EventSource(`https://${window.location.hostname}:${env.PUBLIC_PORT}/home-battery-sse`);

            // Fired when the connection is established
            eventSource.onopen = function() {
                console.log("Connection to server opened.");
                document.getElementById('connection-header').innerHTML = "<b>Connected!</b>";
            };

            // Fired when a message is received from the server
            eventSource.onmessage = function(event) {
                console.log("Received: " + event.data);
                listState.val = listState.val.concat(JSON.parse(event.data));
                return;
                const lines = '<tr>' + JSON.parse(event.data)
                    .map(({ datetime, battery_level, household_load }) =>
                        `<td>${datetime}</td><td>${battery_level}%</td><td>${household_load}W</td>`)
                    .join('</tr><tr>') + '</tr>';
                // The server sends "data: Server time: ...\n\n", event.data contains the string after "data: "
                document.getElementById("output").innerHTML += lines;
            };

            // Fired when an error occurs
            eventSource.onerror = function(err) {
                console.error("EventSource failed:", err);
                if (eventSource.readyState === EventSource.CLOSED) {
                    console.log("Connection closed by server or network error.");
                }
            };
            eventSource.onclose = (event) => {
              console.log('Connection closed');
              // Handle cleanup or reconnection logic here
            };
            // To manually close the connection:
            // eventSource.close();
        });
    </script>
</body>
</html>

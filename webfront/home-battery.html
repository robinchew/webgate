<!DOCTYPE html>
<html>
<head>
    <style>
        pre {
            margin: 0;
        }
        td {
            font-family: monospace;
            text-align: right;
            padding-right: 10px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="connection-header"></div>

    <script>
        function loadScript(src) {
            const scriptAttrs = {
                type: 'text/javascript',
                async: true,
                src,
            };
            return new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = src;
                Object.assign(script, scriptAttrs);
                script.addEventListener('load', () => resolve({ scriptAttrs, loadSuccess: true }));
                script.addEventListener('error', () => resolve({ scriptAttrs, loadSuccess: false }));
                document.head.appendChild(script);
            });
        }
        function logk(k,v) {
            console.log(k,v);
            return v;
        }
        function assert(bool, err)  {
            if (! bool) {
                throw new Error(err);
            }
        }
        function fixedFill(strSize, val) {
            const strVal = `${val}`;
            assert(strVal.length <= strSize, 'strSize must be larger than val size');
            return Array.from({length: strSize - strVal.length}, () => ' ').join('') + strVal;
        }
        function renderLine(datetime, battery_level, household_load) {
            const dt = datetime.replace('T', ' ');
            const bl = fixedFill(3, battery_level);
            const hl = fixedFill(5, household_load);
            return `${dt}  ${bl}  ${hl}`;
        }
        Promise.all(['/van-1.6.1.nomodule.js', '/importEnv.js'].map(loadScript)).then(() => {
            const {a, b, div, pre, span, table, tr, td} = van.tags;
            function OldList(url) {
                const list = van.state([]);
                const el = div(
                    {
                        style: 'position:relative;z-index: 1;background: linear-gradient(to top, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0) 10%)',
                    },
                    () => div(list.val.length === 0 ?
                        a(
                            {
                                href: '',
                                onclick(e) {
                                    e.preventDefault();
                                    fetch(url).then(r => r.json()).then((result) => {
                                        list.val = result.reads;
                                        el.before(OldList('/api/before-discharge/' + result.filename));
                                    });
                                },
                            },
                            'Previous discharge') :
                        pre(
                            {
                                style: 'border-bottom: 1px solid black',
                            },
                            list.val.map(({datetime, battery_level, household_load}) =>
                                renderLine(datetime, battery_level, household_load)).join('\n'))));
                return el;
            }
            function List(list) {
                return pre(
                    {
                        style: 'position:relative;z-index: 1',
                    },
                    list.map(({datetime, battery_level, household_load}) =>
                        renderLine(datetime, battery_level, household_load)).join('\n'));
            }
            const Current = (list) =>
                div(
                    {
                        style: 'position:fixed;top:0;right:0;font-size:7em;white-space:pre;text-align:right;opacity:25%;z-index:0',
                    },
                    () => span((({ battery_level, household_load }) => `${battery_level}%\n${household_load}W`)(list.val.at(-1) || {})));

            const listState = van.state([]);
            document.body.appendChild(Current(listState));
            document.body.appendChild(OldList('/api/last-discharge'));

            const env = importEnv();

            // Connect to the Erlang endpoint
            const eventSource = new EventSource(`https://${window.location.hostname}:${env.PUBLIC_PORT}/home-battery-sse`);

            // Fired when the connection is established
            eventSource.onopen = function() {
                console.log("Connection to server opened.");
                document.getElementById('connection-header').innerHTML = "<b>Connected!</b>";
            };

            // Fired when a message is received from the server
            eventSource.onmessage = function(event) {
                console.log("Received: " + event.data);
                const list = JSON.parse(event.data)
                listState.val = list;
                document.body.appendChild(List(list));
            };

            // Fired when an error occurs
            eventSource.onerror = function(err) {
                console.error("EventSource failed:", err);
                if (eventSource.readyState === EventSource.CLOSED) {
                    console.log("Connection closed by server or network error.");
                }
            };
            eventSource.onclose = (event) => {
              console.log('Connection closed');
              // Handle cleanup or reconnection logic here
            };
            // To manually close the connection:
            // eventSource.close();
        });
    </script>
</body>
</html>

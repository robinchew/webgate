<html>
    <link rel="icon" href="data:,"> <!-- to stop browser for requesting favicon -->
    <head>
        <script>
            // tags.js [v2024-01-01]
            const t = (() => {
                const fragment = (...contents) => {
                  let f = document.createDocumentFragment()
                  for (let c of contents.flat().filter(c => c !== undefined)) {
                    f.appendChild(
                      c instanceof Element || c instanceof DocumentFragment
                        ? c
                        : text(c)
                    )
                  }
                  return f
                }

                const text = document.createTextNode.bind(document)

                const elementProperties = ['checked', 'innerHTML', 'innerText']
                const globalEventHandlers = ['onabort', 'onanimationcancel', 'onanimationend', 'onanimationiteration', 'onanimationstart', 'onauxclick', 'onblur', 'onerror', 'onfocus', 'oncancel', 'oncanplay', 'oncanplaythrough', 'onchange', 'onclick', 'onclose', 'oncontextmenu', 'oncuechange', 'ondblclick', 'ondrag', 'ondragend', 'ondragenter', 'ondragexit', 'ondragleave', 'ondragover', 'ondragstart', 'ondrop', 'ondurationchange', 'onemptied', 'onended', 'onformdata', 'ongotpointercapture', 'oninput', 'oninvalid', 'onkeydown', 'onkeypress', 'onkeyup', 'onload', 'onloadeddata', 'onloadedmetadata', 'onloadend', 'onloadstart', 'onlostpointercapture', 'onmousedown', 'onmouseenter', 'onmouseleave', 'onmousemove', 'onmouseout', 'onmouseover', 'onmouseup', 'onmousewheel', 'onwheel', 'onpause', 'onplay', 'onplaying', 'onpointerdown', 'onpointermove', 'onpointerup', 'onpointercancel', 'onpointerover', 'onpointerout', 'onpointerenter', 'onpointerleave', 'onpointerlockchange', 'onpointerlockerror', 'onprogress', 'onratechange', 'onreset', 'onresize', 'onscroll', 'onseeked', 'onseeking', 'onselect', 'onselectstart', 'onselectionchange', 'onshow', 'onsort', 'onstalled', 'onsubmit', 'onsuspend', 'ontimeupdate', 'onvolumechange', 'ontouchcancel', 'ontouchend', 'ontouchmove', 'ontouchstart', 'ontransitioncancel', 'ontransitionend', 'ontransitionrun', 'ontransitionstart', 'onwaiting']
                const directAttrs = new Set([...elementProperties, ...globalEventHandlers])

                const tag = (tagName, ...args) => {
                  let [first, ...restArgs] = args
                  let { options = {}, children } = typeof first !== 'object' || first === null || first instanceof Element || Array.isArray(first)
                    ? { children: args }
                    : { children: restArgs, options: first }

                  let { class: class_ = [], ...attrs } = options

                  let el = document.createElement(tagName)

                  if (typeof class_ === 'string') {
                    el.className = class_
                  } else {
                    for (let c of class_) {
                      el.classList.add(c)
                    }
                  }

                  for (let [k, v] of Object.entries(attrs)) {
                    if (directAttrs.has(k)) {
                      el[k] = v
                    } else {
                      el.setAttribute(k, v)
                    }
                  }

                  for (let c of children.flat().filter(c => c !== undefined)) {
                    el.appendChild(
                      c instanceof Element || c instanceof DocumentFragment
                        ? c
                        : text(c)
                    )
                  }
                  return el
                }
                return tag;
            })();
            function loadScript(src, attrs = {}) {
                const scriptAttrs = {
                    type: 'text/javascript',
                    async: true,
                    ...attrs,
                    src,
                };
                return new Promise((resolve) => {
                    const script = document.createElement('script');
                    script.src = src;
                    Object.assign(script, scriptAttrs);
                    script.addEventListener('load', () => resolve({ scriptAttrs, loadSuccess: true }));
                    script.addEventListener('error', () => resolve({ scriptAttrs, loadSuccess: false }));
                    document.head.appendChild(script);
                });
            }
            function setCookie(name,value,days) {
                var expires = "";
                if (days) {
                    var date = new Date();
                    date.setTime(date.getTime() + (days*24*60*60*1000));
                    expires = "; expires=" + date.toUTCString();
                }
                // path=/ means any subdirectories under it can have access to cookie
                document.cookie = name + "=" + (value || "")  + expires + "; path=/";
            }
            function getCookie(name) {
                // https://stackoverflow.com/questions/14573223/set-cookie-and-get-cookie-with-javascript
                var nameEQ = name + "=";
                var ca = document.cookie.split(';');
                for(var i=0;i < ca.length;i++) {
                    var c = ca[i];
                    while (c.charAt(0)==' ') c = c.substring(1,c.length);
                    if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length,c.length);
                }
                return null;
            }
            function importLocalStorage({ window: { localStorage } }) {
                return (uniqueKey) => {
                  function get(key) {
                    const whole = JSON.parse(localStorage[uniqueKey] || '{}');
                    return whole[key];
                  }
                  function set(key, value) {
                    const whole = JSON.parse(localStorage[uniqueKey] || '{}');
                    whole[key] = value;
                    return localStorage[uniqueKey] = JSON.stringify(whole);
                  }
                  function replace(whole) {
                    return localStorage[uniqueKey] = JSON.stringify(whole);
                  }
                  function getWhole() {
                    return JSON.parse(localStorage[uniqueKey] || '{}');
                  }
                  return {
                    get,
                    getWhole,
                    set,
                    replace,
                  };
                };
            }
            function promiseCanvasFingerprint() {
              // https://browserleaks.com/canvas#how-does-it-work

              // 1. Create a temporary canvas
              const canvas = document.createElement('canvas');
              const ctx = canvas.getContext('2d');

              // 2. Draw specific shapes and text to generate unique rendering artifacts
              // Draw a rectangle
              ctx.fillStyle = '#f60';
              ctx.fillRect(125, 1, 62, 20);

              // Draw text with specific styling
              ctx.font = '18px Arial';
              ctx.fillStyle = '#069';
              ctx.textBaseline = 'alphabetic';
              ctx.fillText('BrowserLeaks.com', 2, 15);

              // Add some anti-aliasing variation
              ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
              ctx.fillText('BrowserLeaks.com', 4, 17);

              // 3. Convert the canvas to a base64 string
              const dataURL = canvas.toDataURL();

              // Use native SubtleCrypto for SHA-256 hashing
              const encoder = new TextEncoder();
              const data = encoder.encode(dataURL);

              return crypto.subtle.digest('SHA-256', data)
                .then(hashBuffer => {
                  const hashArray = Array.from(new Uint8Array(hashBuffer));
                  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                });
            }
            function initClickTimeout() {
                let timeout = null;
                return (element, { onClick, onTimeout, timeoutMs }) => {
                    element.onclick = (e) => {
                        if (timeout === null) {
                            onClick(e);
                            timeout = setTimeout(() => {
                                onTimeout();
                                timeout = null;
                            }, timeoutMs);
                        }
                    }
                }
            }
        </script>
        <style>
            body {
                padding: 0;
                margin: 0;
            }
            .button-overlay {
                position:absolute;
                top:0;
                left:0;
                width: 100%;
                height: 100%;
                font-size: 50px;
                background: transparent;
                border: 0;
            }
            .button-sub {
                position: absolute;
                width: 0;
                height: 0;
                top: 50%;
                left: 50%;
                font-size: 1.5em;
            }
            .button-sub:before {
                position: absolute;
                width: 300px;
                height: 30px;
                line-height: 30px;
                top: 30px;
                left: -150px;
                text-align: center;
            }
            .warn-box {
                position: absolute;
                text-align: center;
                color: white;
                background: red;
                width: 500px;
                left: -250px;
                top: 70px;
                padding: 10px;
            }
            .warn-big {
                font-size: 2em;
            }
            .stripe-background {
              width: 100%;
              height: 100%;
              /* 45deg creates diagonal stripes */
              /* #e1e1e1 0 to #e1e1e1 1px creates a 1px thick line */
              /* transparent 1px to transparent 50% creates the gap */
              background-image: repeating-linear-gradient(
                -45deg,
                #ccc 6px,
                #ccc 13px,
                transparent 5px,
                transparent 20px
              );
              /* Adjusts the size of the repeating tile */
              background-size: 20px 20px;
              mask-image: linear-gradient(
                -225deg,
                white 0%,
                white var(--pos),
                transparent var(--pos),
                transparent 100%
              );
            }
            .recently-pressed {
                background: red;
                color: white;
            }
            @property --pos {
              syntax: '<percentage>';
              initial-value: 100%;
              inherits: false;
            }
            .gate-open {
                --pos: 50%
            }
            .gate-open-sub:before {
                content: "Fully/Partially Open";
            }
            .gate-close {
                --pos: 100%
            }
            .gate-close-sub:before {
                content: "Fully Closed";
            }
            .gate-closing {
              animation: move-stop 0.5s ease-in-out infinite;
            }
            .gate-closing-sub:before {
                content: "Closing...";
            }
            .gate-opening {
              animation: opening 0.5s ease-in-out infinite;
            }
            .gate-opening-sub:before {
                content: "Opening...";
            }
            .ws-disconnected {
                border: 1px solid red;
                color: red;
            }
            @keyframes opening {
              0% {
                --pos: 40%;
              }
              10% {
                --pos: 25%;
              }
              100% {
                --pos: 40%;
              }
            }
            @keyframes move-stop {
              0% {
                --pos: 70%;
              }
              10% {
                --pos: 85%;
              }
              100% {
                --pos: 70%;
              }
            }
        </style>
    </head>
    <body>
        <script>
            const initLocalStore = importLocalStorage({ window });
            const local = initLocalStore('json_state');
            const appValue = (() => {
                let st = {
                    isAuthed: null,
                    gateState: null,
                    userId: '',
                };
                function val(f) {
                    if (f) {
                        const newSt = f(st);
                        st = newSt;
                        render({ val });
                        return newSt;
                    }
                    return st;
                }
                return val;
            })();
            const classMap = {
                FCLOSE: 'gate-close',
                FPOPEN: 'gate-open',
                CLOSIN: 'gate-closing',
                OPENIN: 'gate-opening',
            };
            function render({ val }) {
                const state = val();
                const cls = classMap[state.gateState] || null;
                document.body.replaceChildren(t('div',
                    { style: 'background:#eee;position:relative' },
                    state.wsDisconnected ?
                        [
                            t('div',
                                {
                                    id: 'gate-button-anim',
                                    style: 'height:100%',
                                }),
                            t('button',
                                {
                                    id: 'reconnect',
                                    class: 'button-overlay ' + ' ws-disconnected',
                                },
                                'Reconnect'),
                        ] :
                        [
                            t('div',
                                {
                                    id: 'gate-button-anim',
                                    class: (state.wsConnected ? 'stripe-background' : '') + ' ' + cls,
                                    style: 'height:100%',
                                }),
                            t('div', { id: 'gate-button-sub', class: 'button-sub ' + cls + '-sub' }),
                            ! state.isAuthed && state.isAuthed !== null ?
                                t('div', { class: 'button-sub unauthed-sub' },
                                    t('div', { class: 'warn-box' },
                                        t('div', { class: 'warn-big' }, 'UNAUTHORISED'),
                                        t('div', { class: 'warn-small' }, state.userId.slice(0, 8)))) :
                                '',
                            t('button',
                                { id: 'gate', class: 'button-overlay ' },
                                t('span',
                                    {
                                        class: state.triggered ? 'recently-pressed' : '',
                                    },
                                    'Gate'))
                        ]));

                return new Promise(resolve => {
                    setTimeout(() => {
                        // Zero timeout hack for code here to run after appendChild finishes appending new element
                        resolve();
                    }, 0);
                });
            }
            let userId = local.get('user_id');
            if (userId == null) {
                local.set('user_id', crypto.randomUUID());
                userId = local.get('user_id');
            }
            const initialVal = {
                wsConnected: true,
                userId,
            };
            Promise.all([loadScript('importEnv.js'), render({ val: appValue })]).then(({ loadSuccess }) => {
                const env = importEnv();
                const socket = new WebSocket(`wss://${window.location.hostname}:${env.PUBLIC_PORT}/ws/${userId}`);

                socket.onopen = () => {
                    console.log('Connected');
                };

                socket.onmessage = (event) => {
                    console.log('Received:', event.data, userId);
                    if (event.data.startsWith('state:')) {
                        const state = event.data.slice(6)
                        if (state === 'RECONN') {
                            // Reload to cause a WS reconnection
                            window.location.reload();
                        }
                        appValue(st => ({
                            ...st,
                            ...initialVal,
                            gateState: state,
                        }));
                    }
                    else if (event.data.startsWith('auth:')) {
                        appValue(st => ({
                            ...st,
                            ...initialVal,
                            isAuthed: event.data.slice(5) === 'AUTHORISED',
                        }));
                    }
                };

                socket.onclose = () => {
                    console.log('Disconnected');
                    appValue(st => ({ ...st, wsDisconnected: true }));
                };
                socket.onerror = (error) => console.error('Error:', error);

                setInterval(() => {
                    socket.send("ping");
                }, 30000);

                // Click to trigger gate
                const timeoutMs = 2000;
                const clickTimeout = initClickTimeout();
                clickTimeout(document.body, {
                    onClick(e) {
                        if (e.target.closest('#gate')) {
                            appValue(st => ({ ...st, triggered: true }));
                            socket.send('trigger');
                        }
                        else if (e.target.id === 'reconnect')   {
                            window.location.reload();
                        }
                    },
                    onTimeout() {
                        appValue(st => ({ ...st, triggered: false }));
                    },
                    timeoutMs,
                });
            });
        </script>
    </body>
</html>
